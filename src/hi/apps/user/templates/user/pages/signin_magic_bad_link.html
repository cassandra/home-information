{% extends "pages/front_door_page.html" %}

{% block front_door_content %}
<h1 class="hi-front-door-title">Link No Longer Valid</h1>
<p class="hi-front-door-prompt">
  The sign-in link has either expired or has already been used.
  Sign in again to get a new link.
</p>
<a id="hi-signin-link" href="{% url 'user_signin' %}"
   class="btn btn-lg btn-primary btn-block">
  <b>Sign In</b>
</a>
{% endblock %}
